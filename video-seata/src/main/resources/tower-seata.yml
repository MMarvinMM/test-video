# Seata 配置项，对应 SeataProperties 类
seata:
  tx-service-group: my_test_tx_group # Seata 事务组编号，用于 TC 集群名
  # Seata 服务配置项，对应 ServiceProperties 类
  config:
    type: nacos
    nacos:
      group: SEATA_GROUP
      namespace: 33b09d77-1d31-438d-8ca7-058f5e275ce8
      server-addr: ${spring.cloud.nacos.discovery.server-addr} # Nacos 服务地址
  service:
    # 虚拟组和分组的映射
    vgroup-mapping:
      my_test_tx_group: default
    disableGlobalTransaction: false #false为开启
  # Seata 注册中心配置项，对应 RegistryProperties 类
  registry:
    type: nacos # 注册中心类型，默认为 file
    nacos:
      application: seata-server
      group: SEATA_GROUP
      namespace: 33b09d77-1d31-438d-8ca7-058f5e275ce8 # Nacos 命名空间
      serverAddr: ${spring.cloud.nacos.discovery.server-addr} # Nacos 服务地址
  enabled: true
