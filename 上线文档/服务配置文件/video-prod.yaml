  video-task.yml: |
    sms:
      templateCode:
        tatistics: xlhm_yfxg    #研判统计短信推送模板编码

    #最大连接数
    http:
      maxTotal: 100
      #并发数
      defaultMaxPerRoute: 20
      #创建连接的最长时间
      connectTimeout: 1000
      #从连接池中获取到连接的最长时间
      connectionRequestTimeout: 500
      #数据传输的最长时间
      socketTimeout: 10000
      #提交请求前测试连接是否可用
      staleConnectionCheckEnabled: true
      #可用空闲连接过期时间,重用空闲连接时会先检查是否空闲时间超过这个时间，如果超过，释放socket重新建立
      validateAfterInactivity: 3000000

    server:
      servlet:
        context-path: /
      tomcat:
        uri-encoding: UTF-8
        max-threads: 800
        min-spare-threads: 30
    logging:
      level:
        root: info
        com.chinatower: debug
        com.alibaba.nacos.client.naming: error
      path: .logs
        #pattern:
      #console: '%d{yyyy-MM-dd HH:mm:ss.SSS,GMT+08} %5level ${PID:- } - %logger : %msg%n'
    spring:
      application:
        name: video-task
      messages:
        basename: i18n/messages
      servlet:
        multipart:
          max-file-size:  30MB
          max-request-size:  100MB
      devtools:
        restart:
          enabled: false
      datasource:
        dynamic:
          primary: statistic
    pagehelper:
      helperDialect: mysql
      reasonable: true
      supportMethodsArguments: true
      params: count=countSql
    xss:
      enabled: true
      excludes: /system/notice/*
      urlPatterns: /system/*,/monitor/*,/tool/*
    gen:
      author: wangzic
      packageName: com.chinatower.idmm.project.modules.cust
      tablePrefix: bs_,tb_


    xxl:
      job:
        enable: true
        accessToken:
        admin:
          addresses: ${tower-config.xxl-job-address}
        executor:
          appname: video-task
          address:
          ip:
          port: ${tower-config.xxl-job-port}
          logpath: ${tower-config.xxl-job-logpath}
          logretentiondays: 30

    maxPageSize:
      mongodb: 20000
      mongodb2: 10000
      oracle: 5000
    obs:
      ak: ${OBS_AK}
      sk: ${OBS_SK}
