#测试环境
video:
  nacos:
    ip: localhost
    port: 8849
    namespace: 367b025e-a336-4a18-8b15-6975d985aa2b
spring:
  #spring cloud
  cloud:
    nacos:
      #nacos注册中心地址
      discovery:
        server-addr: ${video.nacos.ip}:${video.nacos.port}
        namespace: ${video.nacos.namespace}
      #nacos配置中心
      config:
        # 配置文件的格式
        file-extension: yaml
        # 配置中心的地址
        server-addr: ${video.nacos.ip}:${video.nacos.port}
        # 配置文件prefix
        prefix: ${spring.application.name}
        #命名空间
        namespace: ${video.nacos.namespace}
        #关闭动态刷新，默认开启
    #        refresh:
    #         enabled: false
