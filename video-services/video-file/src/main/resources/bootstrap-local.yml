  nacos:
    ip: 127.0.0.1
    port: 8848
    namespace: 53272ed1-99be-4642-bb55-d870921f8074
spring:
  #spring cloud
  cloud:
    nacos:
      #nacos注册中心地址
      discovery:
        server-addr: ${video.nacos.ip}:${video.nacos.port}
        namespace: ${video.nacos.namespace}
      #nacos配置中心
      config:
        # 配置文件的格式
        file-extension: yaml
        # 配置中心的地址
        server-addr: ${video.nacos.ip}:${video.nacos.port}
        # 配置文件prefix
        prefix: ${spring.application.name}
        #命名空间
        namespace: ${video.nacos.namespace}
        #关闭动态刷新，默认开启
    #        refresh:
    #         enabled: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

